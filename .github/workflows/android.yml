name: Android CI
on:
  push:
    branches: [main, "work/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run source HTML extractor tests
        run: python -m unittest discover -s scripts/tests -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run core unit tests
        run: gradle :core:test
      - name: Upload core test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relab-core-test-results
          path: core/build/test-results/test/*.xml
          if-no-files-found: error
  android-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Assemble debug APK
        run: gradle :app:assembleDebug
      - name: Compile Android instrumentation tests
        run: gradle :app:assembleDebugAndroidTest
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: relab-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  android-instrumented-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run Android database instrumentation tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: gradle :app:connectedDebugAndroidTest
      - name: Upload instrumentation test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relab-android-instrumentation-results
          path: app/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn
