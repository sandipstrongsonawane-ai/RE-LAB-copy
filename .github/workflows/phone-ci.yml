name: RE-LAB Phone CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    # GitHub-hosted runner; no DroidRunner or phone runner required.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 35 build packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run source extractor tests
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Run core unit tests
        run: gradle :core:test

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Upload core test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relab-phone-core-test-results
          path: core/build/test-results/test/*.xml
          if-no-files-found: warn

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: relab-phone-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
